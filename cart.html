<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rynex PC — Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-item {
            display: flex;
            gap: 20px;
            background: #141414;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .cart-item .img-box {
            width: 80px;
            height: 80px;
            background: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }
        .cart-item .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cart-item .info { flex: 1; }
        .cart-item .info h4 { color: #f0f0f0; }
        .cart-item .info .price { color: #aaa; }
        .cart-total {
            background: #141414;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            text-align: right;
            margin-top: 20px;
        }
        .cart-total .total-price {
            font-size: 28px;
            font-weight: 700;
            color: #f0f0f0;
        }
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-cart i { font-size: 60px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">Rynex<span>PC</span></a>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 20px;">🛒 Shopping Cart</h2>
        <div id="cartItems">
            <div class="empty-cart">
                <i class="fas fa-shopping-cart"></i>
                <p>Your cart is empty</p>
                <a href="index.html" class="btn btn-primary" style="display:inline-block; padding: 10px 30px;">Go to Catalog</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 Rynex PC. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
