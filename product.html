<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rynex PC — Product</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            background: #141414;
            padding: 30px;
            border-radius: 24px;
            border: 1px solid #2a2a2a;
        }
        .product-detail .img-box {
            height: 350px;
            background: #1f1f1f;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }
        .product-detail .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-detail .info h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }
        .product-detail .info .price {
            font-size: 32px;
            font-weight: 700;
            color: #f0f0f0;
            margin: 16px 0;
        }
        .product-detail .info .desc {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .product-detail .info .specs {
            color: #aaa;
            font-size: 14px;
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }
        .product-detail .info .specs li {
            padding: 6px 0;
            border-bottom: 1px solid #1f1f1f;
        }
        .product-detail .info .specs li strong { color: #f0f0f0; }
        .btn-big {
            padding: 14px 40px;
            font-size: 18px;
            background: #333;
            border: 1px solid #555;
            border-radius: 40px;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-big:hover { background: #444; }
        @media (max-width: 700px) {
            .product-detail { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">Rynex<span>PC</span></a>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="product-detail" id="productDetail">
            <!-- Loaded via JS -->
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 Rynex PC. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id'));
        const product = products.find(p => p.id === id);

        if (product) {
            document.getElementById('productDetail').innerHTML = `
                <div class="img-box">
                    <img src="${product.img}" alt="${product.name}">
                </div>
                <div class="info">
                    <span class="tag water"><i class="fas fa-droplet"></i> Liquid Cooling</span>
                    <h1>${product.name}</h1>
                    <div class="rating">
                        <i class="fas fa-star"></i> ${product.rating} <span>${product.reviews} reviews</span>
                    </div>
                    <div class="price">${product.price.toLocaleString()} €</div>
                    <div class="delivery"><i class="fas fa-truck"></i> Free shipping · tomorrow</div>
                    <p class="desc">Powerful gaming PC with liquid cooling. Perfect for gaming and creative work.</p>
                    <ul class="specs">
                        <li><strong>CPU:</strong> ${product.name.split(' ').slice(2,4).join(' ')}</li>
                        <li><strong>RAM:</strong> from 16GB to 256GB</li>
                        <li><strong>Storage:</strong> SSD from 256GB to 8TB</li>
                        <li><strong>GPU:</strong> from GT 1030 to Dual RTX 5090</li>
                    </ul>
                    <button class="btn-big" onclick="addToCart(${product.id})"><i class="fas fa-cart-plus"></i> Add to Cart</button>
                </div>
            `;
        }

        function addToCart(id) {
            let count = parseInt(document.querySelector('.cart-count').textContent) || 0;
            count++;
            document.querySelector('.cart-count').textContent = count;
            alert('Product added to cart!');
        }
    </script>
</body>
</html>
