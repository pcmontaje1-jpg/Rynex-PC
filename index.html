<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rynex PC — Gaming PCs & Components</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">Rynex<span>PC</span></a>
            <nav>
                <a href="index.html" class="active">Home</a>
                <a href="about.html">About</a>
                <a href="builds.html">Builds</a>
                <a href="components.html">Components</a>
                <a href="custom.html">Custom</a>
                <a href="support.html">Support</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="container">
        <!-- Tabs -->
        <div class="tabs" id="tabContainer">
            <button class="tab active" data-tab="builds"><i class="fas fa-desktop"></i> PC Builds</button>
            <button class="tab" data-tab="components"><i class="fas fa-microchip"></i> Components</button>
        </div>

        <!-- Filters for Builds -->
        <div class="filters" id="filterContainer">
            <span class="pill active" data-filter="all"><i class="fas fa-th-list"></i> All</span>
            <span class="pill" data-filter="budget"><i class="fas fa-coins"></i> Budget</span>
            <span class="pill" data-filter="gaming"><i class="fas fa-gamepad"></i> Gaming</span>
            <span class="pill" data-filter="home"><i class="fas fa-home"></i> Home</span>
            <span class="pill" data-filter="advanced"><i class="fas fa-star"></i> Advanced</span>
            <span class="pill" data-filter="professional"><i class="fas fa-briefcase"></i> Professional</span>
        </div>

        <!-- Search for Components -->
        <div class="search-bar" id="searchBar" style="display:none;">
            <input type="text" id="componentSearch" placeholder="Search for components... (CPU, GPU, RAM, SSD, etc.)" onkeyup="searchComponents()" />
        </div>

        <div class="section-title">
            <h2 id="sectionTitle">Rynex Builds</h2>
            <span class="badge" id="totalBadge">🔥 30 models</span>
        </div>

        <div class="product-grid" id="productGrid"></div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 Rynex PC. All rights reserved.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
