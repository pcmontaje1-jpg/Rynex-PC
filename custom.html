<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rynex PC — Custom Build</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">Rynex<span>PC</span></a>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="builds.html">Builds</a>
                <a href="custom.html" class="active">Custom</a>
                <a href="support.html">Support</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="custom-page">
            <h1>⚙️ Custom Build</h1>
            <p class="sub">Tell us what you need and we'll build it for you.</p>
            <form class="custom-form" id="customForm" onsubmit="sendCustom(event)">
                <label for="customName">Your Name</label>
                <input type="text" id="customName" placeholder="John Doe" required />
                <label for="customEmail">Email Address</label>
                <input type="email" id="customEmail" placeholder="john@example.com" required />
                <label for="customBudget">Budget (€)</label>
                <select id="customBudget" required>
                    <option value="">Select budget...</option>
                    <option value="500">Under 500€</option>
                    <option value="1000">500€ - 1000€</option>
                    <option value="2000">1000€ - 2000€</option>
                    <option value="3000">2000€ - 3000€</option>
                    <option value="5000">3000€ - 5000€</option>
                    <option value="10000">5000€+</option>
                </select>
                <label for="customPurpose">Purpose</label>
                <select id="customPurpose" required>
                    <option value="">Select purpose...</option>
                    <option value="gaming">Gaming</option>
                    <option value="streaming">Streaming</option>
                    <option value="video">Video Editing</option>
                    <option value="3d">3D Rendering</option>
                    <option value="office">Office / Home</option>
                    <option value="other">Other</option>
                </select>
                <label for="customMessage">Additional Details</label>
                <textarea id="customMessage" placeholder="Any specific components or requirements..."></textarea>
                <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Submit Request</button>
            </form>
            <div class="custom-success" id="customSuccess">
                <i class="fas fa-check-circle"></i>
                <h3>Request Sent! ✅</h3>
                <p>We'll contact you within 24 hours with a quote.</p>
                <button class="btn btn-primary" style="display:inline-block; padding:12px 30px; margin-top:16px;" onclick="resetCustom()">
                    <i class="fas fa-plus"></i> Send Another
                </button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 Rynex PC. All rights reserved.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
