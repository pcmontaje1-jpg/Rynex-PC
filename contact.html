<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">Rynex<span>PC</span></a>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="builds.html">Builds</a>
                <a href="custom.html">Custom</a>
                <a href="support.html">Support</a>
                <a href="contact.html" class="active">Contact</a>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="contact-page">
            <h1>📬 Get in Touch</h1>
            <p class="sub">We're here to help you build the perfect PC</p>
            
            <div class="contact-item">
                <div class="icon"><i class="fas fa-envelope"></i></div>
                <div class="info">
                    <div class="label">Email</div>
                    <div class="value"><a href="mailto:info@rynexpc.com">info@rynexpc.com</a></div>
                </div>
            </div>
            
            <div class="contact-item">
                <div class="icon"><i class="fas fa-phone"></i></div>
                <div class="info">
                    <div class="label">Phone</div>
                    <div class="value"><a href="tel:+34123456789">+34 123 456 789</a></div>
                </div>
            </div>
            
            <div class="contact-item">
                <div class="icon"><i class="fas fa-map-marker-alt"></i></div>
                <div class="info">
                    <div class="label">Address</div>
                    <div class="value">Madrid, Spain</div>
                </div>
            </div>
            
            <div class="contact-item">
                <div class="icon"><i class="fab fa-instagram"></i></div>
                <div class="info">
                    <div class="label">Instagram</div>
                    <div class="value"><a href="#">@rynexpc</a></div>
                </div>
            </div>
            
            <div class="contact-item">
                <div class="icon"><i class="fab fa-youtube"></i></div>
                <div class="info">
                    <div class="label">YouTube</div>
                    <div class="value"><a href="#">Rynex PC</a></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 Rynex PC. All rights reserved.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
