<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rynex PC - Contact</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Rynex <span>PC</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="builds.html">Builds</a>
                <a href="custom.html">Custom PC</a>
                <a href="support.html">Support</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
        </div>
    </nav>

    <section class="page-content">
        <div class="section-header">
            <h1>Contact Us</h1>
            <p>We are always available</p>
        </div>
        <div class="contact-info">
            <div class="contact-item">
                <h4>Email:</h4>
                <a href="mailto:pcmontaje1@gmail.com">pcmontaje1@gmail.com</a>
            </div>
            <div class="contact-item">
                <h4>Phone:</h4>
                <a href="tel:+34607416282">+34 607 416 282</a>
            </div>
            <div class="contact-item">
                <h4>Working hours:</h4>
                <p>24/7</p>
            </div>
        </div>
        <form id="contact-form" class="order-form">
            <div class="form-group">
                <label>Your Name:</label>
                <input type="text" id="contact-name" name="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Your Email:</label>
                <input type="email" id="contact-email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Message:</label>
                <textarea id="contact-message" name="message" rows="5" placeholder="Your message..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2024 Rynex PC. All rights reserved</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
